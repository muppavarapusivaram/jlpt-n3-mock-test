<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JLPT N3 本番実戦 模試シミュレーター (Mock Test Simulator)</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #161f30;
      --card-border: #24324a;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --accent: #818cf8;
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.15);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.15);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    header {
      background: #0f172a;
      border-bottom: 1px solid var(--card-border);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .header-title { font-size: 1.15rem; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
    .badge { font-size: 0.75rem; padding: 3px 8px; border-radius: 4px; font-weight: 600; }
    .badge-primary { background: rgba(56, 189, 248, 0.2); color: var(--primary); border: 1px solid var(--primary); }
    .badge-accent { background: rgba(129, 140, 248, 0.2); color: var(--accent); border: 1px solid var(--accent); }

    .header-controls { display: flex; align-items: center; gap: 12px; }
    .select-test { background: var(--card-bg); border: 1px solid var(--card-border); color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
    .timer-badge { background: #1e293b; border: 1px solid #334155; padding: 6px 14px; border-radius: 20px; font-weight: 700; font-family: monospace; font-size: 1.05rem; display: flex; align-items: center; gap: 6px; }
    .timer-badge.warning { background: var(--danger-bg); border-color: var(--danger); color: #fca5a5; }

    .btn { padding: 6px 16px; border-radius: 6px; font-weight: 600; font-size: 0.88rem; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-primary { background: var(--primary); color: #000; }
    .btn-primary:hover { background: var(--primary-hover); color: #fff; }
    .btn-success { background: var(--success); color: #000; }
    .btn-outline { background: transparent; border: 1px solid var(--card-border); color: var(--text); }
    .btn-outline:hover { background: #1e293b; }

    main { flex: 1; display: flex; overflow: hidden; }

    /* Left Sidebar: Question Navigation */
    .sidebar {
      width: 260px;
      background: #0f172a;
      border-right: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-header { padding: 12px 16px; border-bottom: 1px solid var(--card-border); font-size: 0.85rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .sec-tabs { display: flex; border-bottom: 1px solid var(--card-border); }
    .sec-tab { flex: 1; padding: 10px 6px; text-align: center; font-size: 0.8rem; font-weight: 700; background: #0b1120; border: none; color: var(--text-muted); cursor: pointer; }
    .sec-tab.active { background: #162032; color: var(--primary); border-bottom: 2px solid var(--primary); }

    .palette { flex: 1; overflow-y: auto; padding: 14px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; align-content: start; }
    .palette-btn {
      height: 38px;
      border-radius: 6px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .palette-btn:hover { border-color: var(--primary); }
    .palette-btn.active { outline: 2px solid var(--primary); }
    .palette-btn.answered { background: rgba(56, 189, 248, 0.25); border-color: var(--primary); color: #fff; }
    .palette-btn.flagged::after {
      content: "★";
      position: absolute;
      top: 1px;
      right: 3px;
      font-size: 0.7rem;
      color: var(--warning);
    }

    .sidebar-footer { padding: 12px; border-top: 1px solid var(--card-border); background: #0b1120; }
    .progress-stats { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px; display: flex; justify-content: space-between; }

    /* Workspace Content Area */
    .content-area { flex: 1; display: flex; overflow: hidden; }

    /* Passage Pane (for reading/grammar with passage) */
    .passage-pane {
      flex: 1.1;
      background: #0d1424;
      border-right: 1px solid var(--card-border);
      overflow-y: auto;
      padding: 24px;
      display: none;
    }
    .passage-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 24px;
      line-height: 2.1;
      font-size: 1.08rem;
      letter-spacing: 0.03em;
    }
    .passage-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 16px; color: #fff; border-bottom: 2px solid var(--card-border); padding-bottom: 8px; }

    /* Question Pane */
    .question-pane {
      flex: 1.2;
      overflow-y: auto;
      padding: 28px 36px;
      display: flex;
      flex-direction: column;
    }
    .q-banner {
      background: rgba(30, 41, 59, 0.7);
      border-left: 4px solid var(--primary);
      padding: 10px 16px;
      border-radius: 0 6px 6px 0;
      margin-bottom: 20px;
      font-size: 0.95rem;
      color: #cbd5e1;
    }
    .q-main {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 24px;
      margin-bottom: 20px;
    }
    .q-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .q-num { font-size: 1.2rem; font-weight: 800; color: var(--primary); }
    .flag-btn { background: transparent; border: 1px solid #334155; color: var(--text-muted); padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
    .flag-btn.flagged { background: var(--warning-bg); border-color: var(--warning); color: var(--warning); font-weight: 700; }

    .q-text { font-size: 1.22rem; line-height: 1.8; font-weight: 500; margin-bottom: 24px; }
    .q-text u, .q-text mark { background: rgba(56, 189, 248, 0.2); padding: 2px 4px; border-bottom: 2px solid var(--primary); text-decoration: none; border-radius: 2px; }

    .opt-group { display: flex; flex-direction: column; gap: 12px; }
    .opt-card {
      padding: 14px 18px;
      border-radius: 8px;
      background: #111a2c;
      border: 1px solid var(--card-border);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 1.05rem;
      transition: all 0.2s;
    }
    .opt-card:hover { background: #1a2742; border-color: var(--primary); }
    .opt-card.selected { background: rgba(56, 189, 248, 0.2); border-color: var(--primary); color: #fff; font-weight: 600; }
    .opt-num-badge {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      font-weight: 700;
      flex-shrink: 0;
      color: var(--text-muted);
    }
    .opt-card.selected .opt-num-badge { background: var(--primary); color: #000; }

    /* Results Screen */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .results-modal {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      width: 90%;
      max-width: 720px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 32px;
    }
    .results-header { text-align: center; margin-bottom: 24px; }
    .score-banner {
      display: flex;
      justify-content: space-around;
      background: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
      border: 1px solid var(--card-border);
    }
    .score-block { text-align: center; }
    .score-val { font-size: 2.2rem; font-weight: 800; color: #fff; }
    .score-label { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }
    .pass-badge { font-size: 1.4rem; font-weight: 800; padding: 6px 20px; border-radius: 20px; display: inline-block; margin-top: 10px; }
    .pass { background: var(--success-bg); color: var(--success); border: 2px solid var(--success); }
    .fail { background: var(--danger-bg); color: var(--danger); border: 2px solid var(--danger); }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <div class="header-title">
        <span>🎯 JLPT N3 実戦模試シミュレーター</span>
        <span class="badge badge-primary">公式規格 73問</span>
      </div>
      <select id="testSelect" class="select-test" onchange="switchTest(this.value)">
        <!-- Populated dynamically -->
      </select>
    </div>
    <div class="header-controls">
      <div id="timerDisplay" class="timer-badge">
        <span>⏱️</span>
        <span id="timeText">30:00</span>
      </div>
      <button class="btn btn-outline" onclick="togglePauseTimer()">一時停止</button>
      <button class="btn btn-success" onclick="finishExam()">試験終了・採点</button>
    </div>
  </header>

  <main>
    <!-- Left Navigation Sidebar -->
    <div class="sidebar">
      <div class="sec-tabs">
        <button id="tabSec1" class="sec-tab active" onclick="switchSection('sec_vocab')">言語知識 (語彙)<br><small>35問 / 30分</small></button>
        <button id="tabSec2" class="sec-tab" onclick="switchSection('sec_grammar_reading')">文法・読解<br><small>38問 / 70分</small></button>
      </div>
      <div class="palette" id="questionPalette">
        <!-- Palette buttons rendered here -->
      </div>
      <div class="sidebar-footer">
        <div class="progress-stats">
          <span>回答済: <strong id="answeredCount">0</strong> / <span id="totalQuestionsCount">73</span></span>
          <span>目印★: <strong id="flaggedCount">0</strong></span>
        </div>
      </div>
    </div>

    <!-- Main Workspace -->
    <div class="content-area">
      <!-- Reading Passage Pane (if question has passage) -->
      <div id="passagePane" class="passage-pane">
        <div class="passage-box">
          <div id="passageTitle" class="passage-title">本文</div>
          <div id="passageContent"></div>
        </div>
      </div>

      <!-- Question Pane -->
      <div class="question-pane">
        <div id="qInstruction" class="q-banner"></div>
        <div class="q-main">
          <div class="q-top">
            <span id="qNumber" class="q-num">第 1 問</span>
            <button id="flagBtn" class="flag-btn" onclick="toggleFlagCurrent()">★ あとで見直す</button>
          </div>
          <div id="qPrompt" class="q-text"></div>
          <div id="optionsContainer" class="opt-group"></div>
        </div>

        <div style="display:flex; justify-content:space-between; margin-top:auto;">
          <button class="btn btn-outline" onclick="navPrev()">← 前の設問</button>
          <button class="btn btn-primary" onclick="navNext()">次の設問 →</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Results Modal -->
  <div id="resultsModal" class="modal-overlay">
    <div class="results-modal">
      <div class="results-header">
        <h2>試験結果レポート (Score Report)</h2>
        <div id="passBadge" class="pass-badge pass">合格 (PASS)</div>
      </div>
      <div class="score-banner">
        <div class="score-block">
          <div id="langScore" class="score-val">-- / 60</div>
          <div class="score-label">言語知識（文字・語彙・文法）<br>(基準点 19点)</div>
        </div>
        <div class="score-block">
          <div id="readScore" class="score-val">-- / 60</div>
          <div class="score-label">読解 (Reading)<br>(基準点 19点)</div>
        </div>
        <div class="score-block">
          <div id="totalScore" class="score-val" style="color:var(--primary);">-- / 120</div>
          <div class="score-label">総合得点<br>(合格点 63点 / 120点換算)</div>
        </div>
      </div>
      <div id="resultsBreakdown" style="margin-bottom:24px;"></div>
      <div style="display:flex; justify-content:center; gap:12px;">
        <button class="btn btn-primary" onclick="closeResults()">問題を見直す (Review Answers)</button>
        <button class="btn btn-outline" onclick="location.reload()">もう一度受験する</button>
      </div>
    </div>
  </div>

  <script src="mock_tests/mock_test_data.js"></script>
  <script>
    let currentExam = null;
    let currentSectionId = "sec_vocab";
    let currentQIndex = 0; // index in current section questions
    let userAnswers = {}; // q.id -> option (1..4)
    let flaggedQuestions = new Set();
    let isReviewMode = false;

    // Timer state
    let timeLeft = 30 * 60;
    let timerInterval = null;
    let isTimerPaused = false;

    function init() {
      if (!window.MOCK_TEST_DATA) {
        alert("模試データが見つかりません。scripts/mock_test_generator.py を実行してください。");
        return;
      }
      const select = document.getElementById("testSelect");
      select.innerHTML = "";
      Object.keys(window.MOCK_TEST_DATA).forEach(tid => {
        const opt = document.createElement("option");
        opt.value = tid;
        opt.textContent = window.MOCK_TEST_DATA[tid].title;
        select.appendChild(opt);
      });

      switchTest(select.value);
    }

    function switchTest(testId) {
      currentExam = window.MOCK_TEST_DATA[testId];
      userAnswers = {};
      flaggedQuestions.clear();
      isReviewMode = false;
      currentSectionId = "sec_vocab";
      currentQIndex = 0;

      // Start section timer (30 min for Section 1)
      startTimer(30 * 60);

      renderSidebar();
      renderCurrentQuestion();
    }

    function switchSection(secId) {
      currentSectionId = secId;
      currentQIndex = 0;
      document.getElementById("tabSec1").classList.toggle("active", secId === "sec_vocab");
      document.getElementById("tabSec2").classList.toggle("active", secId === "sec_grammar_reading");

      // Switch timer according to section
      if (!isReviewMode) {
        const sec = currentExam.sections.find(s => s.section_id === secId);
        startTimer(sec.time_limit_minutes * 60);
      }

      renderSidebar();
      renderCurrentQuestion();
    }

    function startTimer(seconds) {
      clearInterval(timerInterval);
      timeLeft = seconds;
      isTimerPaused = false;
      updateTimerDisplay();

      timerInterval = setInterval(() => {
        if (!isTimerPaused) {
          timeLeft--;
          updateTimerDisplay();
          if (timeLeft <= 0) {
            clearInterval(timerInterval);
            alert("時間になりました！試験を終了します。");
            finishExam();
          }
        }
      }, 1000);
    }

    function togglePauseTimer() {
      isTimerPaused = !isTimerPaused;
    }

    function updateTimerDisplay() {
      const mins = Math.floor(timeLeft / 60);
      const secs = timeLeft % 60;
      const str = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      const elem = document.getElementById("timeText");
      elem.textContent = str;
      const badge = document.getElementById("timerDisplay");
      badge.classList.toggle("warning", timeLeft <= 300);
    }

    function getCurrentSectionQuestions() {
      const sec = currentExam.sections.find(s => s.section_id === currentSectionId);
      return sec ? sec.questions : [];
    }

    function renderSidebar() {
      const questions = getCurrentSectionQuestions();
      const palette = document.getElementById("questionPalette");
      palette.innerHTML = "";

      questions.forEach((q, idx) => {
        const btn = document.createElement("button");
        btn.className = "palette-btn";
        btn.textContent = q.exam_number || (idx + 1);
        if (idx === currentQIndex) btn.classList.add("active");
        if (userAnswers[q.id]) btn.classList.add("answered");
        if (flaggedQuestions.has(q.id)) btn.classList.add("flagged");

        btn.onclick = () => {
          currentQIndex = idx;
          renderSidebar();
          renderCurrentQuestion();
        };
        palette.appendChild(btn);
      });

      // Update counters
      const allQ = currentExam.sections.flatMap(s => s.questions);
      document.getElementById("totalQuestionsCount").textContent = allQ.length;
      document.getElementById("answeredCount").textContent = Object.keys(userAnswers).length;
      document.getElementById("flaggedCount").textContent = flaggedQuestions.size;
    }

    function renderCurrentQuestion() {
      const questions = getCurrentSectionQuestions();
      if (!questions.length) return;
      const q = questions[currentQIndex];

      // Check passage
      const passagePane = document.getElementById("passagePane");
      if (q.passage_id && currentExam.passages[q.passage_id]) {
        const p = currentExam.passages[q.passage_id];
        document.getElementById("passageTitle").textContent = p.title || "本文";
        document.getElementById("passageContent").innerHTML = p.content.replace(/\n/g, "<br>");
        passagePane.style.display = "block";
      } else {
        passagePane.style.display = "none";
      }

      document.getElementById("qInstruction").textContent = `${q.mondai_label} : ${q.instruction}`;
      document.getElementById("qNumber").textContent = `第 ${q.exam_number} 問 (${q.mondai_label} #${q.mondai_number})`;

      const flagBtn = document.getElementById("flagBtn");
      flagBtn.classList.toggle("flagged", flaggedQuestions.has(q.id));

      // Format prompt
      let promptHtml = q.question.replace(/\n/g, "<br>");
      promptHtml = promptHtml.replace(/__([^_]+)__/g, "<u>$1</u>");
      document.getElementById("qPrompt").innerHTML = promptHtml;

      // Render options
      const optContainer = document.getElementById("optionsContainer");
      optContainer.innerHTML = "";
      const selected = userAnswers[q.id];

      q.options.forEach((optText, optIdx) => {
        const optNum = optIdx + 1;
        const div = document.createElement("div");
        div.className = "opt-card" + (selected === optNum ? " selected" : "");

        if (isReviewMode) {
          if (optNum === q.answer) {
            div.style.borderColor = "var(--success)";
            div.style.background = "var(--success-bg)";
          } else if (selected === optNum) {
            div.style.borderColor = "var(--danger)";
            div.style.background = "var(--danger-bg)";
          }
        }

        div.innerHTML = `
          <div class="opt-num-badge">${optNum}</div>
          <div style="flex:1;">${optText}</div>
        `;
        if (!isReviewMode) {
          div.onclick = () => {
            userAnswers[q.id] = optNum;
            renderSidebar();
            renderCurrentQuestion();
          };
        }
        optContainer.appendChild(div);
      });
    }

    function toggleFlagCurrent() {
      const q = getCurrentSectionQuestions()[currentQIndex];
      if (flaggedQuestions.has(q.id)) {
        flaggedQuestions.delete(q.id);
      } else {
        flaggedQuestions.add(q.id);
      }
      renderSidebar();
      renderCurrentQuestion();
    }

    function navPrev() {
      if (currentQIndex > 0) {
        currentQIndex--;
        renderSidebar();
        renderCurrentQuestion();
      }
    }

    function navNext() {
      const questions = getCurrentSectionQuestions();
      if (currentQIndex < questions.length - 1) {
        currentQIndex++;
        renderSidebar();
        renderCurrentQuestion();
      } else if (currentSectionId === "sec_vocab") {
        if (confirm("言語知識（文字・語彙）の全問に到達しました。第2部（文法・読解）に進みますか？")) {
          switchSection("sec_grammar_reading");
        }
      }
    }

    function finishExam() {
      clearInterval(timerInterval);
      isReviewMode = true;

      // Calculate score
      let vocabCorrect = 0, grammarCorrect = 0, readingCorrect = 0;
      const sec1 = currentExam.sections[0];
      const sec2 = currentExam.sections[1];

      sec1.questions.forEach(q => {
        if (userAnswers[q.id] === q.answer) vocabCorrect++;
      });

      sec2.grammar_questions.forEach(q => {
        if (userAnswers[q.id] === q.answer) grammarCorrect++;
      });

      sec2.reading_questions.forEach(q => {
        if (userAnswers[q.id] === q.answer) readingCorrect++;
      });

      const langTotalCorrect = vocabCorrect + grammarCorrect;
      const langMaxCorrect = sec1.questions.length + sec2.grammar_questions.length;
      const readMaxCorrect = sec2.reading_questions.length;

      // Scaled Scores (out of 60)
      const langScaled = Math.round((langTotalCorrect / langMaxCorrect) * 60);
      const readScaled = Math.round((readingCorrect / readMaxCorrect) * 60);
      const totalScore = langScaled + readScaled;

      // JLPT Passing Criteria: Total >= 95/180 (equivalent to 63/120) and both sections >= 19
      const isPassed = (totalScore >= 63) && (langScaled >= 19) && (readScaled >= 19);

      document.getElementById("langScore").textContent = `${langScaled} / 60`;
      document.getElementById("readScore").textContent = `${readScaled} / 60`;
      document.getElementById("totalScore").textContent = `${totalScore} / 120`;

      const badge = document.getElementById("passBadge");
      if (isPassed) {
        badge.className = "pass-badge pass";
        badge.textContent = "合格 (PASS)";
      } else {
        badge.className = "pass-badge fail";
        badge.textContent = "不合格 (FAIL)";
      }

      document.getElementById("resultsBreakdown").innerHTML = `
        <div style="background:#131c2d; padding:16px; border-radius:8px; line-height:1.8; font-size:0.95rem;">
          <div><strong>正答率内訳:</strong></div>
          <div>・ 文字・語彙: ${vocabCorrect} / ${sec1.questions.length} 問 (${Math.round(vocabCorrect/sec1.questions.length*100)}%)</div>
          <div>・ 文法: ${grammarCorrect} / ${sec2.grammar_questions.length} 問 (${Math.round(grammarCorrect/sec2.grammar_questions.length*100)}%)</div>
          <div>・ 読解: ${readingCorrect} / ${readMaxCorrect} 問 (${Math.round(readingCorrect/readMaxCorrect*100)}%)</div>
          <div>・ 全体正答数: ${vocabCorrect + grammarCorrect + readingCorrect} / 73 問</div>
        </div>
      `;

      document.getElementById("resultsModal").style.display = "flex";
      renderSidebar();
      renderCurrentQuestion();
    }

    function closeResults() {
      document.getElementById("resultsModal").style.display = "none";
    }

    window.onload = init;
  </script>
</body>
</html>
